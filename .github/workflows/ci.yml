name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bearfoster/gig-planner-api-dotnet
          ref: codex/phase-0-integration
          path: .integration/gig-planner-api-dotnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - run: npm ci
      - run: dotnet restore
        working-directory: .integration/gig-planner-api-dotnet
      - run: npm run api:check
        env:
          GIG_PLANNER_BACKEND_DIR: ${{ github.workspace }}/.integration/gig-planner-api-dotnet
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:real
        env:
          GIG_PLANNER_BACKEND_DIR: ${{ github.workspace }}/.integration/gig-planner-api-dotnet
